name = "sundaecha-api"
main = "src/index.ts"
compatibility_date = "2026-05-03"

[[d1_databases]]
binding = "DB"
database_name = "sundaecha"
database_id = "local-sundaecha-db"
migrations_dir = "migrations"

[vars]
LOCATION_STALE_DAYS = "14"
ADMIN_KEY = "dev-admin-key"
# Slack Incoming Webhook은 시크릿으로 설정: npx wrangler secret put SLACK_WEBHOOK_URL
# SLACK_WEBHOOK_URL = ""

[observability]
enabled = true

[observability.traces]
enabled = true
